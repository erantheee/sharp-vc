name: Validate Sharp VC

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate behavior suite
        run: python scripts/run_behavioral_evals.py --validate-suite
      - name: Validate investment case library
        run: python scripts/validate_investment_cases.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
